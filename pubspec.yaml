name: crop_alerts
description: "Weather-driven early warning for crop diseases, pests and other problems."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  intl: any
  path_provider: ^2.1.5
  phosphor_flutter: ^2.1.0
  shared_preferences: ^2.5.5
  workmanager: ^0.10.9

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
