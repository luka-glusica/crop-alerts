name: crop_alerts
description: "Weather-driven early warning for crop diseases, pests and other problems."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_svg: ^2.3.0
  intl: any
  path_provider: ^2.1.5
  phosphor_icons: ^3.0.1
  shared_preferences: ^2.5.5
  workmanager: ^0.10.9

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  yaml: ^3.1.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo.svg
    - assets/crops/
    - assets/fonts/OFL.txt

  fonts:
    # Inter is bundled rather than fetched at runtime so the app renders
    # correctly on a first launch with no network. Licensed under the SIL Open
    # Font License 1.1 (see assets/fonts/OFL.txt).
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
