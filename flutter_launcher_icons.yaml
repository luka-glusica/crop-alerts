# Generates the Android and iOS launcher icons from the app logo.
# Regenerate after changing assets/icon/*.svg with:
#   rsvg-convert -w 1024 -h 1024 assets/icon/app_icon.svg -o assets/icon/app_icon.png
#   rsvg-convert -w 1024 -h 1024 assets/icon/app_icon_foreground.svg -o assets/icon/app_icon_foreground.png
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  android: "ic_launcher"
  min_sdk_android: 21
  # Android composites the foreground over the background and applies its own
  # mask, so the foreground is the artwork alone, inset to the safe zone.
  adaptive_icon_background: "#ECFDF5"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

  ios: true
  # iOS rejects icons with an alpha channel, and masks the corners itself.
  remove_alpha_ios: true
